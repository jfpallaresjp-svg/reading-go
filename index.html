<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reading block</title>
<style>
  :root { color-scheme: dark; --bg:#0f1417; --ink:#e8eef1; --muted:#8fa3ad; --line:rgba(255,255,255,.14); }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, sans-serif;
         display:grid; place-items:center; padding-inline:16px; text-align:center; }
  main { display:flex; flex-direction:column; align-items:center; gap:14px; max-width:32ch; }
  h1 { font-size:19px; font-weight:500; margin:0; }
  p { margin:0; color:var(--muted); font-size:13.5px; }
  a { color:var(--ink); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:999px;
      padding:9px 18px; text-decoration:none; font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>Starting your reading block</h1>
  <p>Tap Open when Safari asks. If nothing happens, tap the button.</p>
  <a id="go" href="#">Start the block</a>
  <p>Coming back to Safari closes this tab.</p>
</main>
<script>
  // Opened by the Training OS reading timer as .../reading-go/#40 (the minutes). Hands them to the iPhone Shortcut
  // "Reading block", which starts the ScreenZen session. Nothing here is stored or sent anywhere.
  var m = (location.hash.match(/^#(\d{1,3})$/) || [])[1] || '';
  var url = 'shortcuts://run-shortcut?name=' + encodeURIComponent('Reading block') + (m ? '&input=text&text=' + m : '');
  document.getElementById('go').href = url;
  var left = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) left = true;
    else if (left) window.close();              // back from Shortcuts: close this tab so the dashboard is in front again
  });
  setTimeout(function () { location.href = url; }, 150);
</script>
</body>
</html>

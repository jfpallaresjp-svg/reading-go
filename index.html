<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reading block</title>
<style>
  :root { color-scheme: dark; --bg:#0f1417; --ink:#e8eef1; --muted:#8fa3ad; --line:rgba(255,255,255,.14); }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, sans-serif;
         display:grid; place-items:center; padding-inline:16px; text-align:center; }
  main { display:flex; flex-direction:column; align-items:center; gap:14px; max-width:32ch; }
  h1 { font-size:19px; font-weight:500; margin:0; }
  p { margin:0; color:var(--muted); font-size:13.5px; }
  a { color:var(--ink); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:999px;
      padding:9px 18px; text-decoration:none; font-weight:500; }
</style>
</head>
<body>
<main>
  <h1 id="h">Starting your reading block</h1>
  <p id="p1">Tap Open when Safari asks. If nothing happens, tap the button.</p>
  <a id="go" href="#">Start the block</a>
  <p id="p2">Coming back to Safari closes this tab.</p>
</main>
<script>
  // Opened by the Training OS dashboard. Reading timer: .../reading-go/#40 (Start, the minutes) runs the iPhone Shortcut
  // "Reading block" (ScreenZen session + Reading Focus on); #stop (Stop) runs "Reading block stop". Nothing here is
  // stored or sent anywhere.
  var stop = location.hash === '#stop';
  var m = (location.hash.match(/^#(\d{1,3})$/) || [])[1] || '';
  // #safari=code/routines/<id> (the dashboard's Apply now / Start now): open that claude.ai page in Safari, because the
  // Claude app can't show a routine and opening it there leaves a blank screen. Only claude.ai routine pages.
  var sf = (location.hash.match(/^#safari=(code\/routines\/[\w-]{4,80})$/) || [])[1] || '';
  var url = sf ? 'x-safari-https://claude.ai/' + sf
               : 'shortcuts://run-shortcut?name=' + encodeURIComponent(stop ? 'Reading block stop' : 'Reading block') +
                 (m ? '&input=text&text=' + m : '');
  if (stop) { document.getElementById('h').textContent = 'Ending your reading block';
              document.getElementById('go').textContent = 'End the block'; document.title = 'Reading block stop'; }
  if (sf) { document.getElementById('h').textContent = 'Opening your routine in Safari';
            document.getElementById('go').textContent = 'Open in Safari'; document.title = 'Open in Safari';
            document.getElementById('p1').textContent = 'Then tap \u25b7 next to Active to run it now.';
            document.getElementById('p2').textContent = 'First time: sign in to claude.ai in Safari.'; }
  if (/^#safari=/.test(location.hash) && !sf) {                  // not a claude.ai routine: open nothing
    document.getElementById('h').textContent = 'Nothing to open'; document.getElementById('go').hidden = true;
    document.getElementById('p1').textContent = 'That link isn\u2019t a Training OS routine.'; document.getElementById('p2').textContent = '';
    url = '';
  }
  // #tos-run=<why>&repo=<owner>/<repo> (the Training OS sync button, Todd's Apply now, a saved workout; 2026-09-30):
  // start the Garmin poller's workflow, which starts the cloud routine at once. The GitHub token (fine-grained: that one
  // repository, Actions read and write) is pasted here once and kept only in this browser; nothing is in this page.
  var run = location.hash.match(/^#tos-run=([^&]{1,60})&repo=([\w.-]{1,40}\/[\w.-]{1,60})$/);
  if (run) { url = ''; tosRun(decodeURIComponent(run[1]), run[2]); }
  function tosRun(why, repo) {
    var h = document.getElementById('h'), p1 = document.getElementById('p1'), p2 = document.getElementById('p2'), go = document.getElementById('go');
    document.title = 'Training OS sync'; go.hidden = true;
    var key = 'tos:gh:' + repo, tok = ''; try { tok = localStorage.getItem(key) || ''; } catch (e) {}
    function setup(msg) {
      h.textContent = 'One-time setup'; p1.textContent = msg || 'Paste a GitHub fine-grained token for ' + repo + ' with Actions: Read and write. It stays in this browser only.';
      p2.textContent = '';
      var f = document.createElement('form'); f.style.cssText = 'display:flex;flex-direction:column;gap:10px;width:100%';
      f.innerHTML = '<input type="password" autocomplete="off" placeholder="github_pat_…" style="font:inherit;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#1b2226;color:#e8eef1">'
        + '<button type="submit" style="font:inherit;font-weight:600;padding:11px;border-radius:999px;border:0;background:#a9c3cf;color:#0f1417">Save and sync</button>';
      p1.after(f);
      f.addEventListener('submit', function (ev) { ev.preventDefault(); var v = f.querySelector('input').value.trim(); if (!v) return;
        try { localStorage.setItem(key, v); } catch (e) {} f.remove(); dispatch(v); });
    }
    function dispatch(t) {
      h.textContent = 'Starting your sync…'; p1.textContent = ''; p2.textContent = '';
      fetch('https://api.github.com/repos/' + repo + '/actions/workflows/garmin-poll.yml/dispatches', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + t, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ ref: 'main', inputs: { fire: why } })
      }).then(function (r) {
        if (r.status === 204) { h.textContent = '\u2713 Sync started'; p1.textContent = 'Your dashboard updates in about 3 minutes.'; p2.textContent = 'Switch back to Claude: this tab closes itself.'; return; }
        if (r.status === 401 || r.status === 403 || r.status === 404) { try { localStorage.removeItem(key); } catch (e) {} return setup('GitHub refused that token (' + r.status + '). Paste a new one: fine-grained, ' + repo + ', Actions: Read and write.'); }
        h.textContent = 'Sync didn\u2019t start'; p1.textContent = 'GitHub answered ' + r.status + '. Try again in a minute.';
      }).catch(function () { h.textContent = 'No connection'; p1.textContent = 'Try again when you\u2019re online.'; });
    }
    if (tok) dispatch(tok); else setup();
  }
  if (url) document.getElementById('go').href = url;
  var left = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) left = true;
    else if (left) window.close();              // back from Shortcuts: close this tab so the dashboard is in front again
  });
  if (url) setTimeout(function () { location.href = url; }, 150);
</script>
</body>
</html>
